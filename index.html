<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayCycle — Annual Paycheck Budget Planner</title>
<style>
:root{--plum:#14532d;--plum2:#2563eb;--amber:#f59e0b;--amber2:#fcd34d;--cream:#faf6ef;--paper:#ffffff;--ink:#292524;--muted:#78716c;--line:#dce8dd;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:#ffffff;color:#292524;border-bottom:1px solid #e7dcc8;padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:.2px}
header h1 span{color:#14532d}
header p{margin:2px 0 0;color:#78716c;font-size:14px}
#demoBanner{display:none;background:#fff3cd;border:2px solid var(--amber);padding:10px 14px;margin:14px 22px 0;border-radius:10px;font-weight:600}
.wrap{display:flex;align-items:flex-start;gap:0;max-width:1240px;margin:0 auto}
nav{width:230px;flex-shrink:0;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:#d9e8dc;border-right:1px solid #b7d3bd}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:#292524;padding:10px 12px;margin:0 0 4px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600}
nav button svg{width:22px;height:22px;flex-shrink:0}

nav button.active{background:#166534;color:#ffffff}
nav button:hover{background:#c8dfcd}
nav .navlabel{font-size:12px;letter-spacing:1px;color:#4b5563;text-transform:uppercase;margin:14px 8px 6px}
main{flex:1;min-width:0;padding:16px 22px 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px;box-shadow:0 1px 4px rgba(20,83,45,.08)}
.card h2{margin:0 0 6px;font-size:20px}
.card h3{margin:16px 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{font-size:22px;display:block}
.kpi span{color:var(--muted);font-size:13px}
.kpi.good b{color:var(--green)} .kpi.bad b{color:var(--red)} .kpi.amber b{color:#9a6a00}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfc4b8;border-radius:9px;font-size:15px;background:#fff}
input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.btn{background:#14532d;color:#fff;border:0;padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(20,83,45,.25);transition:all .15s ease}
button.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,83,45,.35)}
button.btn.amber{background:var(--amber);color:#3a2700}
button.btn.ghost{background:#fff;color:#14532d;border:1px solid #14532d;box-shadow:none}
button.btn.ghost:hover{background:#f0fdf4;box-shadow:none}
button.btn.small{padding:7px 14px;font-size:13px}
button.btn.danger{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#e2e8f0;border-radius:8px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--amber)}
.bar.green i{background:var(--green)} .bar.red i{background:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;background:#ccfbf1;color:#14532d}
.tag.want{background:#fdf0d5;color:#7a5200} .tag.save{background:#e2f2e9;color:var(--green)}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.pill.paid{background:#e2f2e9;color:var(--green)} .pill.due{background:#fde8e0;color:var(--red)} .pill.soon{background:#fdf0d5;color:#7a5200}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 2px;cursor:pointer;font-size:13px}
.days button.on{background:var(--green);color:#fff;border-color:var(--green)}
.note{background:#fdf6e3;border:1px solid var(--amber2);border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.warn{background:#fdeee9;border:1px solid #f0b9a8;border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 16px}
@media(max-width:820px){.wrap{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;gap:8px;padding:12px;border-right:0;border-bottom:1px solid #b7d3bd}nav button{white-space:nowrap;width:auto;margin:0}nav .navlabel{display:none}.kpis{grid-template-columns:1fr 1fr}.row,.row2{grid-template-columns:1fr}main{padding:12px}}

.homecards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 16px}
.homecard{border-radius:18px;padding:18px;min-height:150px}
.homecard b{font-size:26px;display:block;margin:6px 0 2px}
.homecard span{font-size:13px;color:#44403c}
.badge{display:inline-block;float:right;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(0,0,0,.25);color:#fff}
.minibars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:10px}
.minibars i{display:block;flex:1;border-radius:3px;background:rgba(255,255,255,.55)}
.panel3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 16px}
.panel3 .card{margin:0}
.row2 .card{margin:0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:13px}
.calgrid button{border:0;border-radius:8px;padding:8px 0;cursor:pointer;background:#e7e0d2}
.calgrid button.logged{background:#f9a8d4}
.calgrid button.nospend{background:#a3b18a}
.calgrid button.today{background:#292524;color:#fff}
.jarwrap{display:flex;align-items:flex-end;gap:14px;overflow-x:auto;padding:10px 4px 0}
.jar{text-align:center;flex-shrink:0;width:86px}
.jar .amt{font-weight:700;font-size:14px;margin-bottom:6px}
.jar .body{width:72px;height:110px;margin:0 auto;border:2px solid #d6c9a8;border-radius:14px 14px 18px 18px;position:relative;overflow:hidden;background:#fff}
.jar .fill{position:absolute;bottom:0;left:0;right:0}
.jar .lid{width:72px;height:8px;margin:0 auto;border-radius:4px;background:#c9b795}
.shelf{height:14px;background:#c9a876;border-radius:6px;margin-top:2px}
.stepchips{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 16px}
.stepchip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.stepchip.done{border-color:#a3b18a}
.stepchip .tick{display:inline-block;width:22px;height:22px;border-radius:50%;background:#a3b18a;color:#fff;text-align:center;line-height:22px;font-size:13px;font-weight:700}
.stepchip b{display:block;margin-top:6px;font-size:14px}
.stepchip span{font-size:12px;color:var(--muted)}
@media(max-width:820px){.homecards,.panel3,.stepchips{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
<div>
<h1>PayCycle <span>Annual Budget Planner</span></h1>
<p>Your money, paycheck by paycheck. No account, no subscription, nothing leaves your browser.</p>
</div>
</header>
<div id="demoBanner">DEMO PREVIEW — This copy is filled with sample numbers so you can see every page working. Your own copy starts blank. Nothing here is saved to any server.</div>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
"use strict";
/* PayCycle — original annual paycheck budget planner. No external files, no server, no bank connection. */
const LS_KEY = "paycycle-annual-v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const $ = s => document.querySelector(s);
const money = (n, cur) => { const c = cur || state.settings.currency || "$"; const dec = (state.settings.decimals === 0 ? 0 : 2); const v = Number(n || 0).toLocaleString("en-US", {minimumFractionDigits: dec, maximumFractionDigits: dec}); return state.settings.currencyPos === "after" ? v + c : c + v; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function blankState() {
  return {
    settings: {year: 2027, startMonth: 0, currency: "$", currencyPos: "before", dateFormat: "MM/DD/YYYY", firstDay: "Sunday", method: "zero", goalNeeds: 50, goalWants: 30, goalSave: 20, paydayFreq: "biweekly", firstPayday: "2027-01-02"},
    people: [{id: uid(), name: "Person 1"}],
    accounts: [],
    categories: [
      {id: uid(), name: "Salary", kind: "income", tag: "need", budget: Array(12).fill(0)},
      {id: uid(), name: "Rent", kind: "bills", tag: "need", budget: Array(12).fill(0)},
      {id: uid(), name: "Groceries", kind: "expenses", tag: "need", budget: Array(12).fill(0)},
      {id: uid(), name: "Fun money", kind: "expenses", tag: "want", budget: Array(12).fill(0)},
      {id: uid(), name: "Emergency fund", kind: "savings", tag: "save", budget: Array(12).fill(0)}
    ],
    recurring: [],
    paymentsDone: {},   /* key: recurringId|YYYY-MM-DD -> {paid:true, amount} */
    transactions: [],
    funds: [],
    debts: [],
    assets: [],
    noSpend: {},        /* YYYY-MM-DD -> true */
    challenges: []
  };
}
let state = blankState();
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.settings) state = p; }
} catch (e) { /* private mode: keep in memory only */ }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function cat(id) { return state.categories.find(c => c.id === id); }
function person(id) { return state.people.find(p => p.id === id); }
function acct(id) { return state.accounts.find(a => a.id === id); }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseDate(s) { const p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n) { const x = new Date(d); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; }
/* The 12 budget months, starting at the chosen start month, may cross into the next calendar year. */
function budgetMonths() {
  const out = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(state.settings.year, state.settings.startMonth + i, 1);
    out.push({label: MONTHS[d.getMonth()] + " " + d.getFullYear(), year: d.getFullYear(), month: d.getMonth(), index: i});
  }
  return out;
}
function monthOf(dateStr) { const d = parseDate(dateStr); return budgetMonths().find(m => m.year === d.getFullYear() && m.month === d.getMonth()); }
function occurrences(rec) {
  /* Generate every occurrence of a recurring item inside the 12 budget months. */
  const months = budgetMonths();
  const start = new Date(months[0].year, months[0].month, 1);
  const end = new Date(months[11].year, months[11].month + 1, 0);
  const first = parseDate(rec.firstDate || ymd(start));
  const out = [];
  if (rec.freq === "onetime") { const od = parseDate(rec.firstDate || ymd(start)); if (od >= start && od <= end) out.push(od); }
  else if (rec.freq === "semimonthly") {
    let cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
      [1, 15].forEach(day => { const d = new Date(cur.getFullYear(), cur.getMonth(), day); if (d >= first && d <= end) out.push(d); });
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
  } else {
    let d = new Date(first);
    let guard = 0;
    while (d <= end && guard++ < 600) {
      if (d >= start) out.push(new Date(d));
      if (rec.freq === "weekly") d = addDays(d, 7);
      else if (rec.freq === "biweekly") d = addDays(d, 14);
      else if (rec.freq === "monthly") d = addMonths(d, 1);
      else if (rec.freq === "quarterly") d = addMonths(d, 3);
      else if (rec.freq === "yearly") d = addMonths(d, 12);
      else if (rec.freq === "everyx") d = addDays(d, Math.max(1, +rec.everyX || 1));
      else break;
    }
  }
  return out.map(d => ({date: ymd(d), rec: rec, paid: !!(state.paymentsDone[rec.id + "|" + ymd(d)] || {}).paid,
    amount: (state.paymentsDone[rec.id + "|" + ymd(d)] || {}).amount != null ? +state.paymentsDone[rec.id + "|" + ymd(d)].amount : +rec.amount || 0}));
}
function allOccurrences() { let out = []; state.recurring.forEach(r => out = out.concat(occurrences(r))); return out.sort((a, b) => a.date < b.date ? -1 : 1); }
function txInMonth(tx, m) { const d = parseDate(tx.date); return d.getFullYear() === m.year && d.getMonth() === m.month; }
function monthTotals(m) {
  let income = 0, spend = 0, needs = 0, wants = 0, save = 0, budget = 0;
  state.categories.forEach(c => { budget += (+c.budget[m.index] || 0); });
  state.transactions.filter(t => txInMonth(t, m)).forEach(t => {
    const c = cat(t.categoryId); const amt = +t.amount || 0;
    if (c && c.kind === "income") { income += amt; }
    else {
      spend += amt;
      if (!c || c.tag === "need") needs += amt; else if (c.tag === "want") wants += amt; else save += amt;
    }
  });
  allOccurrences().filter(o => { const d = parseDate(o.date); return o.paid && d.getFullYear() === m.year && d.getMonth() === m.month; }).forEach(o => {
    const c = cat(o.rec.categoryId); const amt = +o.amount || 0;
    if (c && c.kind === "income") income += amt;
    else { spend += amt; if (!c || c.tag === "need") needs += amt; else if (c.tag === "want") wants += amt; else save += amt; }
  });
  return {income: income, spend: spend, needs: needs, wants: wants, save: save, budget: budget, left: income - spend};
}
function accountBalance(a) {
  let bal = (+a.opening || 0) + (+a.adjustment || 0);
  const applyFlow = (c, amt) => {
    if (a.type === "credit") bal += (c && (c.kind === "income" || c.kind === "debts")) ? -amt : amt;
    else bal += (c && c.kind === "income") ? amt : -amt;
  };
  state.transactions.filter(t => t.accountId === a.id).forEach(t => applyFlow(cat(t.categoryId), +t.amount || 0));
  allOccurrences().filter(o => o.paid && o.rec.accountId === a.id).forEach(o => applyFlow(cat(o.rec.categoryId), +o.amount || 0));
  return bal;
}
function accountTotals(a) {
  let inn = 0, out = 0;
  const flow = (c, amt) => {
    if (!c || c.kind === "income") { inn += amt; return; }
    if (a.type === "credit" && c.kind === "debts") { inn += amt; return; }
    out += amt;
  };
  state.transactions.filter(t => t.accountId === a.id).forEach(t => flow(cat(t.categoryId), +t.amount || 0));
  allOccurrences().filter(o => o.paid && o.rec.accountId === a.id).forEach(o => flow(cat(o.rec.categoryId), +o.amount || 0));
  return {inn: inn, out: out, current: accountBalance(a)};
}
function paydays() {
  const months = budgetMonths();
  const start = new Date(months[0].year, months[0].month, 1);
  const end = new Date(months[11].year, months[11].month + 1, 0);
  const freq = state.settings.paydayFreq; let d = parseDate(state.settings.firstPayday || ymd(start));
  const out = []; let guard = 0;
  while (d <= end && guard++ < 200) {
    if (d >= start) out.push(new Date(d));
    if (freq === "weekly") d = addDays(d, 7);
    else if (freq === "biweekly") d = addDays(d, 14);
    else if (freq === "semimonthly") { d = d.getDate() < 15 ? new Date(d.getFullYear(), d.getMonth(), 15) : new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    else if (freq === "monthly") d = addMonths(d, 1);
    else break;
  }
  return out;
}
</script>

  challenges: '<svg viewBox="0 0 24 24" fill="none"><path d="M8 4h8v4a4 4 0 0 1-8 0V4z" fill="#f59e0b"/><path d="M8 6H5a3 3 0 0 0 3 5M16 6h3a3 3 0 0 1-3 5" stroke="#b45309" stroke-width="2"/><path d="M12 12v4M8 20h8M10 16h4" stroke="#64748b" stroke-width="2"/></svg>',
  forecast: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 19l5-6 4 3 6-8 3 3" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 8h4v4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/></svg>',

};
const TABS = [

function debtCompare(extra) {

}

    (sched ? '<p style="margin-top:12px"><b>Debt-free in about ' + sched.months + ' months</b> if every minimum is paid plus the extra amount. Estimated total interest: ' + money(sched.interest, state.settings.currency) + '.</p>' + debtCompare(extra) + '<table><tr><th>Order</th><th>Debt</th><th class="num">Balance</th><th class="num">Interest</th><th>Paid off in month</th></tr>' + sched.rows.map(r => '<tr><td>' + r.order + '</td><td>' + esc(r.name) + '</td><td class="num">' + money(r.balance, state.settings.currency) + '</td><td class="num">' + r.apr + '%</td><td>' + (r.doneMonth || "—") + '</td></tr>').join("") + "</table>" : '<p class="muted">Add a debt above to see its payoff plan.</p>') + "</div>";

function debtSchedule(strat, extra) {
  if (!state.debts.length) return null;
  const ds = state.debts.map(d => ({name: d.name, balance: +d.balance || 0, apr: +d.apr || 0, min: +d.min || 0, doneMonth: null}));
  ds.sort((a, b) => strat === "avalanche" ? b.apr - a.apr : a.balance - b.balance);
  let month = 0, interest = 0, remaining = ds.length;
  while (remaining > 0 && month < 600) {
    month++;
    let extraLeft = extra;
    ds.forEach(d => { if (d.balance > 0) { const it = d.balance * (d.apr / 100) / 12; interest += it; d.balance += it; } });
    ds.forEach(d => { if (d.balance > 0) { const pay = Math.min(d.balance, d.min); d.balance -= pay; if (d.balance <= 0.005) { d.balance = 0; if (!d.doneMonth) { d.doneMonth = month; remaining--; } } } });
    for (const d of ds) {
      if (extraLeft <= 0) break;
      if (d.balance > 0) { const pay = Math.min(d.balance, extraLeft); d.balance -= pay; extraLeft -= pay; if (d.balance <= 0.005) { d.balance = 0; if (!d.doneMonth) { d.doneMonth = month; remaining--; } } }
    }
  }
  return {months: month, interest: interest, rows: ds.map((d, i) => ({order: i + 1, name: d.name, balance: state.debts.find(x => x.name === d.name) ? +state.debts.find(x => x.name === d.name).balance || 0 : 0, apr: d.apr, doneMonth: d.doneMonth}))};
}

  /* This month vs last chart */

  const cum = (mm, arr) => { let s = 0; const out = []; for (let d = 1; d <= new Date(mm.year, mm.month + 1, 0).getDate(); d++) { s += arr[d - 1] || 0; out.push(s); } return out; };

  const prevCum = prevM ? cum(prevM, (() => { const a = Array(new Date(prevM.year, prevM.month + 1, 0).getDate()).fill(0); state.transactions.filter(x => txInMonth(x, prevM)).forEach(x => { const c = cat(x.categoryId); if (!c || c.kind !== "income") a[parseDate(x.date).getDate() - 1] += +x.amount || 0; }); allOccurrences().filter(o => o.paid && (() => { const d = parseDate(o.date); return d.getFullYear() === prevM.year && d.getMonth() === prevM.month; })()).forEach(o => { const c = cat(o.rec.categoryId); if (!c || c.kind !== "income") a[parseDate(o.date).getDate() - 1] += +o.amount || 0; }); return a; })()) : null;
  let chartSVG = "";

/* ---------- Setup wizard ---------- */
function setupDoneFlags() {
  const s = state.settings;
  const year = !!(s.year && s.currency);
  const people = state.people.length > 0;
  const income = state.recurring.some(r => { const c = cat(r.categoryId); return c && c.kind === "income"; });
  const cats = state.categories.length > 0;
  const strat = !!(s.method === "zero" || s.method === "carry");
  const next = year && people && income && cats && strat;
  return [year, people, income, cats, strat, next];
}
function saveSetupStep0() {
  const s = state.settings;
  s.year = +$("#sYear").value || 2027; s.startMonth = +$("#sStart").value || 0;
  s.firstDay = $("#sFirstDay").value; s.currency = $("#sCur").value || "$";
  s.currencyPos = $("#sCurPos").value; s.decimals = +$("#sDec").value; s.dateFormat = $("#sDateFmt").value;

}
function saveStrategy() {

function startNextYear() {
  if (!confirm("Start the next budget year? A backup file will download first. Your year moves forward by one, recurring start dates move forward by one year, and your old transactions stay in history so balances stay correct. Monthly amounts carry over by position from your start month.")) return;
  exportJSON();
  const s = state.settings; s.year = (+s.year || 2027) + 1;
  const shift = iso => { if (!iso) return iso; const d = parseDate(iso); d.setFullYear(d.getFullYear() + 1); return ymd(d); };

}

    body = '<div class="card"><p class="muted">STEP 5 OF 6</p><h2>Budget strategy</h2><p class="muted">How unspent money is treated, and your 50 / 30 / 20 goals.</p>' +
      '<div class="row2"><div><label>Strategy</label><select id="sMethod"><option value="zero"' + (s.method === "zero" ? " selected" : "") + '>Zero-based — give every dollar a job</option><option value="carry"' + (s.method === "carry" ? " selected" : "") + '>Carried over — unspent money rolls forward</option></select></div>' +
      '<div><label>50 / 30 / 20 goals (%)</label><div style="display:flex;gap:6px"><input type="number" id="fN" value="' + s.goalNeeds + '" title="Needs"><input type="number" id="fW" value="' + s.goalWants + '" title="Wants"><input type="number" id="fS" value="' + s.goalSave + '" title="Savings"></div></div></div>' +
      '<p class="muted">Zero-based: Budget Plan should add up to your planned income — the gap is shown on Budget Plan. Carried over: unspent money from earlier months in this budget year adds to this month’s left in Monthly and Paycheck View. Payday pattern is set in step 1’s companion fields below: frequency and first payday live with your year settings.</p>' +
      '<div class="row"><div><label>Payday frequency</label><select id="fFreq"><option value="weekly"' + (s.paydayFreq === "weekly" ? " selected" : "") + '>Weekly</option><option value="biweekly"' + (s.paydayFreq === "biweekly" ? " selected" : "") + '>Every 2 weeks</option><option value="semimonthly"' + (s.paydayFreq === "semimonthly" ? " selected" : "") + '>Twice a month (1st &amp; 15th)</option><option value="monthly"' + (s.paydayFreq === "monthly" ? " selected" : "") + '>Monthly</option></select></div>' +
      '<div><label>First payday</label><input type="date" id="fPay" value="' + s.firstPayday + '"></div><div></div></div>' +
      '<p style="margin-top:12px"><button class="btn" onclick="state.settings.paydayFreq=$(\'#fFreq\').value;state.settings.firstPayday=$(\'#fPay\').value;saveStrategy()">Save strategy</button></p>' + navBtns(3, 5) + "</div>";
  } else {
    body = '<div class="card"><p class="muted">STEP 6 OF 6</p><h2>What’s next</h2><p class="muted">You have set up: ' + state.people.length + " people, " + state.categories.length + " categories, " + state.recurring.length + " repeating items, " + state.accounts.length + " accounts.</p>" +
      '<p><b>1.</b> Add your accounts in Bank Accounts, then your repeating bills in Recurring, then your monthly amounts in Budget Plan.</p>' +
      '<p><b>2.</b> Log everyday spending in Transactions. Home, Calendar, Monthly and Paycheck View fill themselves in from what you logged.</p>' +
      '<p><b>3.</b> Export a backup regularly from Start Here — your data lives in this browser only.</p>' +
      '<p><button class="btn" style="background:#292524" onclick="showTab(\'dashboard\')">Go to Home →</button> <button class="btn ghost" onclick="exportJSON()">Export backup</button> <button class="btn amber" onclick="startNextYear()">Start next year</button></p>' + navBtns(4, null) + "</div>";
  }
  return '<div class="card"><h2>Setup</h2><p class="muted">One place for every list and setting the rest of the planner reads. <b>' + flags.filter(Boolean).length + ' of 6 steps done</b></p></div>' + chips + body;
}

/* ---------- Bank Accounts ---------- */
function addAcct() {
  const n = $("#newAcctName") ? $("#newAcctName").value.trim() : "";
  if (!n) return;
  state.accounts.push({id: uid(), name: n, type: $("#newAcctType").value, opening: +$("#newAcctOpen").value || 0, adjustment: +($("#newAcctAdj").value || 0), lastChecked: $("#newAcctChecked").value || ""});
  save(); render();
}
function renderAccounts() {
  const cur = state.settings.currency;
  const spendable = state.accounts.filter(a => a.type === "checking" || a.type === "cash").reduce((s, a) => s + accountBalance(a), 0);
  const saving = state.accounts.filter(a => a.type === "savings").reduce((s, a) => s + accountBalance(a), 0);
  const owed = state.accounts.filter(a => a.type === "credit").reduce((s, a) => s + accountBalance(a), 0);
  const rows = state.accounts.map(a => { const tt = accountTotals(a); return "<tr><td>" + esc(a.name) + "</td><td>" + a.type + "</td><td class='num'>" + money(a.opening, cur) + "</td><td class='num'>" + money(a.adjustment || 0, cur) + "</td><td>" + (a.lastChecked ? fmtDate(a.lastChecked) : "—") + "</td><td class='num'>" + money(tt.inn, cur) + "</td><td class='num'>" + money(tt.out, cur) + "</td><td class='num'><b>" + money(tt.current, cur) + (a.type === "credit" ? " owed" : "") + "</b></td><td><button class='btn small ghost' onclick=\"delAcct('" + a.id + "')\">🗑</button></td></tr>"; }).join("");
  const totStart = state.accounts.reduce((s, a) => s + (+a.opening || 0), 0);
  const totAdj = state.accounts.reduce((s, a) => s + (+a.adjustment || 0), 0);
  const totIn = state.accounts.reduce((s, a) => s + accountTotals(a).inn, 0);
  const totOut = state.accounts.reduce((s, a) => s + accountTotals(a).out, 0);
  const totNet = spendable + saving - owed;
  const distSegs = state.accounts.filter(a => a.type !== "credit" && accountBalance(a) > 0).map(a => ({label: a.name, value: accountBalance(a), color: a.type === "savings" ? "#f9a8d4" : a.type === "cash" ? "#fcd34d" : "#93c5fd"}));
  return '<div class="card"><h2>Bank Accounts</h2><p class="muted">Every account and card, with balances worked out from your logs.</p></div>' +
    '<div class="sumcards c3"><div class="sumcard"><span class="ic">💼</span><span> Total spendable</span><b>' + money(spendable, cur) + '</b><span>Checking + cash</span></div>' +
    '<div class="sumcard"><span class="ic">🐷</span><span> Total saving</span><b>' + money(saving, cur) + '</b><span>Savings accounts</span></div>' +
    '<div class="sumcard"><span class="ic">💳</span><span> Total owed on credit cards</span><b>' + money(owed, cur) + "</b><span>What you owe, not a balance</span></div></div>" +
    '<div class="card"><h3>Accounts</h3><div style="overflow-x:auto"><table><tr><th>Account name</th><th>Type</th><th class="num">Starting balance</th><th class="num">Adjustment +/−</th><th>Last checked</th><th class="num">Total in</th><th class="num">Total out</th><th class="num">Current balance</th><th></th></tr>' + rows +
    '<tr><td><input id="newAcctName" placeholder="Add an account"></td><td><select id="newAcctType"><option value="checking">Checking</option><option value="savings">Savings</option><option value="cash">Cash</option><option value="credit">Credit card</option></select></td>' +
    '<td><input type="number" step="0.01" id="newAcctOpen" placeholder="0.00"></td><td><input type="number" step="0.01" id="newAcctAdj" placeholder="0.00"></td><td><input type="date" id="newAcctChecked"></td><td></td><td></td><td><button class="btn small" onclick="addAcct()">Add</button></td><td></td></tr>' +
    '<tr><td><b>Total</b> <span class="muted">(cards subtracted)</span></td><td></td><td class="num"><b>' + money(totStart, cur) + '</b></td><td class="num">' + money(totAdj, cur) + '</td><td></td><td class="num">' + money(totIn, cur) + '</td><td class="num">' + money(totOut, cur) + '</td><td class="num"><b>' + money(totNet, cur) + "</b></td><td></td></tr></table></div>" +
    '<p class="muted">Total in and out count transactions plus bills you ticked Paid, plus transfers between your own accounts. A credit-card payment counts as “in” for the card because it reduces what you owe. Adjustment is a correction to the starting balance — use it when the bank balance and the planner disagree, instead of editing the opening balance.</p></div>' +
    '<div class="card"><h3>Account distribution</h3>' + donutSVG(distSegs, spendable + saving, "in your accounts") + "</div>";
}

/* ---------- Budget Plan ---------- */
function setBudgetMonthly(id, v) { const c = cat(id); if (c) { c.budget = Array(12).fill(+v || 0); save(); render(); } }
function renderBudget() {
  const months = budgetMonths(); const cur = state.settings.currency;
  let plannedInc = 0, plannedOut = 0;
  state.categories.forEach(c => { const tot = c.budget.reduce((s, v) => s + (+v || 0), 0); if (c.kind === "income") plannedInc += tot; else plannedOut += tot; });
  const leftB = plannedInc - plannedOut;
  const kinds = ["income", "bills", "subscriptions", "expenses", "savings", "debts"];
  let head = "<tr><th>Sub-category</th><th class='num'>Monthly</th>" + months.map(m => "<th class='num'>" + m.label.split(" ")[0].slice(0, 3) + " " + m.year + "</th>").join("") + "</tr>";
  let rows = "";
  kinds.forEach(kind => {
    const cats = state.categories.filter(c => c.kind === kind);
    if (!cats.length) return;
    rows += '<tr style="background:' + KIND_COLOR[kind] + '55"><td><b>' + KIND_LABEL[kind] + "</b> " + cats.length + '</td><td></td>' + months.map(() => "<td></td>").join("") + "</tr>";
    cats.forEach(c => {
      rows += "<tr><td>• " + esc(c.name) + "</td><td><input type='number' step='0.01' style='padding:6px' value='" + (+c.budget[0] || 0) + "' onchange=\"setBudgetMonthly('" + c.id + "',this.value)\"></td>" +
        months.map(m => '<td><input type="number" step="0.01" style="padding:6px" value="' + (+c.budget[m.index] || 0) + '" onchange="setBudget(\'' + c.id + '\',' + m.index + ',this.value)"></td>').join("") + "</tr>";
    });
    rows += '<tr><td><b>Total ' + KIND_LABEL[kind] + '</b></td><td class="num"><b>' + money(cats.reduce((s, c) => s + (+c.budget[0] || 0), 0), cur) + "</b></td>" + months.map(m => '<td class="num"><b>' + money(cats.reduce((s, c) => s + (+c.budget[m.index] || 0), 0), cur) + "</b></td>").join("") + "</tr>";
  });
  return '<div class="card"><h2>Budget Plan</h2><p class="muted">The only place budgets are typed: every sub-category for the 12 budget months.</p></div>' +
    '<div class="sumcards c3"><div class="sumcard"><span class="ic">💵</span><span> Planned income</span><b>' + money(plannedInc, cur) + "</b><span>Whole budget year</span></div>" +
    '<div class="sumcard"><span class="ic">🧾</span><span> Planned outflows</span><b>' + money(plannedOut, cur) + "</b><span>Whole budget year</span></div>" +
    '<div class="sumcard"><span class="ic">🎯</span><span> Left to budget</span><b>' + money(leftB, cur) + "</b><span>Planned income minus planned outflows</span></div></div>" +
    (state.settings.method === "zero" && leftB !== 0 ? '<div class="note">Zero-based: outflows do not match planned income yet by ' + money(Math.abs(leftB), cur) + ". Give the difference a job — add it to a savings category, or trim a category — so every dollar is planned.</div>" : "") +
    '<div class="card"><h3>Budget grid <span style="float:right"><button class="btn small ghost" onclick="setupStep=3;showTab(\'setup\')">✎ Edit sub-categories in Setup</button></span></h3><p class="muted">Monthly fills the whole year with one amount — change single months after that for bills that vary.</p><div style="overflow-x:auto"><table>' + head + rows + "</table></div></div>";
}
</script>

<script>
"use strict";
/* PayCycle v4 part 2 — Recurring, Transfers, Payments, Transactions, nav + render. */
let recFilter = "all";
function setRecAmt(id, v) { const r = state.recurring.find(x => x.id === id); if (r) { r.amount = +v || 0; save(); } }
function setRecFirst(id, v) { const r = state.recurring.find(x => x.id === id); if (r) { r.firstDate = v; save(); render(); } }
function setRecAcct(id, v) { const r = state.recurring.find(x => x.id === id); if (r) { r.accountId = v; save(); render(); } }
function setRecPerson(id, v) { const r = state.recurring.find(x => x.id === id); if (r) { r.personId = v; save(); render(); } }
function setRecFreq(id, v) { const r = state.recurring.find(x => x.id === id); if (r) { r.freq = v; save(); render(); } }
function setRecVarying(id, on) { const r = state.recurring.find(x => x.id === id); if (r) { r.varying = on; save(); render(); } }
function addRecQuickKind(kind) {
  const p = "q" + kind;
  const nameEl = document.getElementById(p + "_cat");
  const catId = nameEl ? nameEl.value : "";
  const c = cat(catId); if (!c) return;
  const nm = c.name;
  state.recurring.push({id: uid(), name: nm, categoryId: catId, personId: document.getElementById(p + "_person").value, accountId: document.getElementById(p + "_acct").value, toAcct: (document.getElementById(p + "_toacct") ? document.getElementById(p + "_toacct").value : ""), amount: +document.getElementById(p + "_amt").value || 0, freq: document.getElementById(p + "_freq").value, firstDate: document.getElementById(p + "_first").value, everyX: +document.getElementById(p + "_x").value || 10, varying: !!document.getElementById(p + "_var").checked});
  save(); render();
}
function addTransferQuick() {
  const name = document.getElementById("qTRF_name").value.trim(); if (!name) return;
  state.transfers.push({id: uid(), name: name, fromId: document.getElementById("qTRF_from").value, toId: document.getElementById("qTRF_to").value, amount: +document.getElementById("qTRF_amt").value || 0, freq: document.getElementById("qTRF_freq").value, firstDate: document.getElementById("qTRF_first").value, everyX: +document.getElementById("qTRF_x").value || 10, varying: false, personId: document.getElementById("qTRF_person").value});
  save(); render();
}
function delTransfer(id) { state.transfers = state.transfers.filter(t => t.id !== id); save(); render(); }
function setTransferAmt(id, v) { const t = state.transfers.find(x => x.id === id); if (t) { t.amount = +v || 0; save(); } }
function setTransferFirst(id, v) { const t = state.transfers.find(x => x.id === id); if (t) { t.firstDate = v; save(); render(); } }
function freqLabel(f) { return {weekly:"Every week", biweekly:"Every 2 weeks", semimonthly:"Twice a month", monthly:"Every month", quarterly:"Every quarter", yearly:"Every year", everyx:"Every X days", onetime:"One time"}[f] || f; }
function freqOptions(sel) {
  return ["weekly", "biweekly", "semimonthly", "monthly", "quarterly", "yearly", "everyx", "onetime"].map(f => '<option value="' + f + '"' + (f === sel ? " selected" : "") + ">" + freqLabel(f) + "</option>").join("");
}
function personOptions(sel) { return state.people.map(p => '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + ">" + esc(p.name) + "</option>").join(""); }
function acctOptions(sel) { return state.accounts.map(a => '<option value="' + a.id + '"' + (a.id === sel ? " selected" : "") + ">" + esc(a.name) + "</option>").join(""); }
function renderRecurring() {
  const cur = state.settings.currency;
  const kinds = [
    {kind: "income", title: "Income", sub: "Paycheques and other income that repeats. To account is where the money lands.", prefix: "INC"},
    {kind: "bills", title: "Bills", sub: "Rent, utilities, insurance. From account is the account or card that pays it. Need / Want is optional: leave it empty to use the tag from Setup.", prefix: "BIL"},
    {kind: "subscriptions", title: "Subscriptions", sub: "Streaming, memberships, anything billed on a schedule. From account is the account or card that pays it.", prefix: "SUB"},
    {kind: "debts", title: "Debts", sub: "Loan payments. From account is the account that pays. A credit-card payoff is not a debt payment here: it goes in Transfers.", prefix: "DBT"},
    {kind: "savings", title: "Savings", sub: "Money you set aside on a schedule. From account is where it leaves, To account is the saving account it goes into.", prefix: "SAV"}
  ];
  const counts = {};
  kinds.forEach(k => counts[k.kind] = state.recurring.filter(r => { const c = cat(r.categoryId); return c && c.kind === k.kind; }).length);
  const totalRec = state.recurring.length;
  let chips = '<p><button class="btn small ' + (recFilter === "all" ? "" : "ghost") + '" onclick="recFilter=\'all\';render()">All ' + totalRec + "</button> ";
  kinds.forEach(k => chips += '<button class="btn small ' + (recFilter === k.kind ? "" : "ghost") + '" onclick="recFilter=\'' + k.kind + '\';render()">' + k.title + " " + counts[k.kind] + "</button> ");
  chips += '<button class="btn small ' + (recFilter === "transfer" ? "" : "ghost") + '" onclick="recFilter=\'transfer\';render()">Transfers ' + state.transfers.length + "</button></p>";
  let out = '<div class="card"><h2>Recurring</h2><p class="muted">Enter every repeating money movement once. The planner works out each date for the year.</p>' + chips + "</div>";
  kinds.forEach(k => {
    if (recFilter !== "all" && recFilter !== k.kind) return;
    const items = state.recurring.filter(r => { const c = cat(r.categoryId); return c && c.kind === k.kind; });
    let rows = "";
    items.forEach((r, idx) => {
      const idLabel = k.prefix + "-" + String(idx + 1).padStart(2, "0");
      const catsOfKind = state.categories.filter(c => c.kind === k.kind);
      rows += '<tr><td><span class="muted">⋮⋮</span> ' + idLabel + "</td><td><select onchange=\"setRecCat('" + r.id + "',this.value)\">" + catsOfKind.map(c => '<option value="' + c.id + '"' + (c.id === r.categoryId ? " selected" : "") + ">" + esc(c.name) + "</option>").join("") + "</select></td>" +
        '<td><select onchange="setRecFreq(\'' + r.id + "',this.value)\">" + freqOptions(r.freq) + "</select></td>" +
        (k.kind === "income" ? '<td class="num">' + (r.freq === "semimonthly" ? "15" : "—") + "</td>" : "") +
        '<td><input type="number" step="0.01" style="width:110px;padding:6px" value="' + r.amount + '" onchange="setRecAmt(\'' + r.id + "',this.value)\"></td>" +
        '<td><input type="checkbox"' + (r.varying ? " checked" : "") + ' onchange="setRecVarying(\'' + r.id + "',this.checked)\"></td>" +
        '<td><input type="date" style="padding:6px" value="' + r.firstDate + '" onchange="setRecFirst(\'' + r.id + "',this.value)\"></td>" +
        '<td><span class="muted">—</span></td>' +
        '<td><select onchange="setRecAcct(\'' + r.id + "',this.value)\">" + acctOptions(r.accountId) + "</select></td>" +
        (k.kind === "savings" ? '<td><select onchange="setRecToAcct(\'' + r.id + "',this.value)\">" + acctOptions(r.toAcct || "") + "</select></td>" : "") +
        '<td><select onchange="setRecPerson(\'' + r.id + "',this.value)\">" + personOptions(r.personId) + "</select></td>" +
        '<td><button class="btn small ghost" onclick="delRec(\'' + r.id + '\')">🗑</button></td></tr>';
    });
    const p = "q" + k.kind;
    const catsOfKind = state.categories.filter(c => c.kind === k.kind);
    const nextLabel = k.prefix + "-" + String(items.length + 1).padStart(2, "0");
    rows += '<tr><td>+ ' + nextLabel + "</td><td><select id=\"" + p + "_cat\">" + catsOfKind.map(c => '<option value="' + c.id + '">' + esc(c.name) + "</option>").join("") + "</select></td>" +
      '<td><select id="' + p + '_freq">' + freqOptions("monthly") + '</select> <input type="number" id="' + p + '_x" value="10" style="width:60px;padding:6px" title="Days, for Every X days"></td>' +
      (k.kind === "income" ? "<td></td>" : "") +
      '<td><input type="number" step="0.01" style="width:110px;padding:6px" id="' + p + '_amt" placeholder="0.00"></td>' +
      '<td><input type="checkbox" id="' + p + '_var"></td>' +
      '<td><input type="date" style="padding:6px" id="' + p + '_first" value="' + (budgetMonths()[0].year + "-" + String(budgetMonths()[0].month + 1).padStart(2, "0") + "-01") + '"></td>' +
      '<td><span class="muted">—</span></td>' +
      '<td><select id="' + p + '_acct">' + acctOptions(state.accounts[0] ? state.accounts[0].id : "") + "</select></td>" +
      (k.kind === "savings" ? '<td><select id="' + p + '_toacct">' + acctOptions(state.accounts[0] ? state.accounts[0].id : "") + "</select></td>" : "") +
      '<td><select id="' + p + '_person">' + personOptions(state.people[0] ? state.people[0].id : "") + '</select></td>' +
      '<td><button class="btn small" onclick="addRecQuickKind(\'' + k.kind + '\')">Add</button></td></tr>';
    out += '<div class="card"><h3><span style="display:inline-block;width:26px;height:26px;border-radius:7px;background:' + KIND_COLOR[k.kind] + ';vertical-align:middle"></span> ' + k.title + '</h3><p class="muted">' + k.sub + "</p><div style='overflow-x:auto'><table><tr><th>ID</th><th>Sub-category</th><th>Frequency</th>" + (k.kind === "income" ? "<th>2nd day</th>" : "") + "<th>Amount</th><th>Varies</th><th>1st payment</th><th>End date</th><th>" + (k.kind === "income" ? "To account" : "From account") + "</th>" + (k.kind === "savings" ? "<th>To account</th>" : "") + "<th>Person</th><th></th></tr>" + rows + "</table></div></div>";
  });
  if (recFilter === "all" || recFilter === "transfer") {
    let trows = "";
    state.transfers.forEach((t, idx) => {
      trows += '<tr><td>TRF-' + String(idx + 1).padStart(2, "0") + "</td><td>" + esc(t.name) + "</td><td><select onchange=\"setTransferFreq('" + t.id + "',this.value)\">" + freqOptions(t.freq) + "</select></td>" +
        '<td><input type="number" step="0.01" style="width:110px;padding:6px" value="' + t.amount + '" onchange="setTransferAmt(\'' + t.id + "',this.value)\"></td>" +
        '<td><input type="date" style="padding:6px" value="' + t.firstDate + '" onchange="setTransferFirst(\'' + t.id + "',this.value)\"></td>" +
        '<td><span class="muted">—</span></td><td>' + esc(acct(t.fromId) ? acct(t.fromId).name : "") + "</td><td>" + esc(acct(t.toId) ? acct(t.toId).name : "") + "</td><td>" + esc(person(t.personId) ? person(t.personId).name : "") + '</td><td><button class="btn small ghost" onclick="delTransfer(\'' + t.id + '\')">🗑</button></td></tr>';
    });
    trows += '<tr><td>+ TRF-' + String(state.transfers.length + 1).padStart(2, "0") + '</td><td><input id="qTRF_name" placeholder="Add a transfer"></td><td><select id="qTRF_freq">' + freqOptions("monthly") + '</select> <input type="number" id="qTRF_x" value="10" style="width:60px;padding:6px" title="Days, for Every X days"></td>' +
      '<td><input type="number" step="0.01" style="width:110px;padding:6px" id="qTRF_amt" placeholder="0.00"></td>' +
      '<td><input type="date" style="padding:6px" id="qTRF_first" value="' + (budgetMonths()[0].year + "-" + String(budgetMonths()[0].month + 1).padStart(2, "0") + "-01") + '"></td>' +
      '<td><span class="muted">—</span></td><td><select id="qTRF_from">' + acctOptions(state.accounts[0] ? state.accounts[0].id : "") + '</select></td><td><select id="qTRF_to">' + acctOptions(state.accounts[0] ? state.accounts[0].id : "") + '</select></td><td><select id="qTRF_person">' + personOptions(state.people[0] ? state.people[0].id : "") + '</select></td><td><button class="btn small" onclick="addTransferQuick()">Add</button></td></tr>';
    out += '<div class="card"><h3><span style="display:inline-block;width:26px;height:26px;border-radius:7px;background:#d6d3d1;vertical-align:middle"></span> Transfers</h3><p class="muted">Automatic moves between your own accounts, like a credit-card autopay or a cash withdrawal. Fill in both From and To. Transfers never count as income or spending.</p><div style="overflow-x:auto"><table><tr><th>ID</th><th>Description</th><th>Frequency</th><th>Amount</th><th>1st payment</th><th>End date</th><th>From account</th><th>To account</th><th>Person</th><th></th></tr>' + trows + "</table></div></div>";
  }
  out += '<div class="card"><p class="muted">End date shows “—” because items run through the whole budget year. To stop one, remove it. Its payments live in <button class="btn small ghost" onclick="showTab(\'payments\')">Payments →</button></p></div>';
  return out;
}

function periodBudget(c, startD, endD) {
  let total = 0;
  budgetMonths().forEach(m => {
    const mStart = new Date(m.year, m.month, 1), mEnd = new Date(m.year, m.month + 1, 0);
    const oStart = startD > mStart ? startD : mStart, oEnd = endD < mEnd ? endD : mEnd;
    if (oStart <= oEnd) {
      const days = Math.round((oEnd - oStart) / 86400000) + 1;
      const daysIn = mEnd.getDate();
      total += (+c.budget[m.index] || 0) * days / daysIn;
    }
  });
  return total;
}

<script>
